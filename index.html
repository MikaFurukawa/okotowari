.stage img{width:100%;max-width:150px;justify-self:center;position:relative;z-index:1;display:block}
.deji{justify-self:center;position:relative;z-index:1;width:100%;max-width:150px}
.deji img{width:100%;display:block}
.lean{transform-origin:50% 100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.lean.on{transform:rotate(5deg) translateX(6px)}
.jump.go-jump{animation:hop .7s ease-out}
.sway{transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}55%{transform:translateY(0)}72%{transform:translateY(-6px)}}
.cheer{position:absolute;top:2%;right:-18%;background:var(--paper);color:var(--navy);border:2px solid var(--navy);border-radius:14px;padding:2px 10px;font-weight:900;font-size:.9rem;white-space:nowrap;opacity:0;transform:translateY(6px) scale(.9);transition:opacity .25s,transform .25s;pointer-events:none;z-index:2}
.cheer.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.sway,.jump.go-jump{animation:none}.lean,.cheer{transition:none}}
.mimi{width:100%;max-width:160px;transform-origin:50% 100%}.mimi.pop{animation:pop .6s ease-out}@keyframes pop{0%{transform:scale(1,1)}20%{transform:scale(1.08,.86)}45%{transform:translateY(-16px) scale(.94,1.1)}70%{transform:translateY(0) scale(1.05,.95)}85%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}@media (prefers-reduced-motion:reduce){.mimi.pop{animation:none}}
.stage svg{width:100%;max-width:170px;justify-self:center;position:relative;z-index:1;display:block}
.bubble{grid-column:1/-1;background:var(--soft);border-radius:20px;padding:14px 16px;margin-bottom:10px;font-weight:700;min-height:3.4em}
.who{font-size:.85rem;color:var(--sub);font-weight:700}
section{background:var(--paper);border-radius:22px;padding:18px;margin-top:16px}
label.h{display:block;font-weight:900;color:var(--navy);margin-bottom:8px;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{font:inherit;font-weight:700;border:2px solid var(--sky);background:transparent;color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.chips button:hover{background:var(--soft)}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
p.h{margin:0 0 8px}
textarea{width:100%;font:inherit;border:2px solid var(--soft);border-radius:14px;padding:10px 12px;background:var(--paper);color:var(--ink);min-height:80px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--navy);height:28px}
.scale{display:flex;justify-content:space-between;font-size:.85rem;color:var(--sub);font-weight:700}
.level{font-size:1.3rem;font-weight:900;color:var(--navy)}
.go{display:block;width:100%;margin-top:16px;font:inherit;font-size:1.15rem;font-weight:900;border:0;border-radius:18px;padding:14px;background:var(--navy);color:#fff;cursor:pointer}
:root[data-theme="dark"] .go{color:#1C2233}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#1C2233}}
.go:disabled{opacity:.5;cursor:wait}
.result{white-space:pre-wrap;font-weight:500}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button{font:inherit;font-weight:700;border:2px solid var(--navy);background:transparent;color:var(--navy);border-radius:12px;padding:6px 14px;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.hidden{display:none}

function setMimi(i){const m=$("mimi");if(m.dataset.i==String(i))return;m.dataset.i=i;m.src=MIMI[i];m.classList.remove("pop");void m.offsetWidth;m.classList.add("pop")}
const cheers=[null,"やさしく言えてえらい！","その調子！","いいね、はっきり！","かっこいいよ！","よく言えたね！"];
let cheerT=0;
function cheerUp(txt){$("lean").classList.add("on");$("cheer").textContent=txt;$("cheer").classList.add("on");clearTimeout(cheerT);cheerT=setTimeout(()=>{$("lean").classList.remove("on");$("cheer").classList.remove("on")},1600)}
function hop(){const j=$("jump");j.classList.remove("go-jump");void j.offsetWidth;j.classList.add("go-jump")}
function setLevel(){const L=levels[+$("lv").value];$("lvName").textContent=L.name;setMimi(+$("lv").value-1);$("talkText").textContent=L.say}
$("lv").addEventListener("input",setLevel);setLevel();
$("lv").addEventListener("pointerdown",e=>{const el=$("lv"),r=el.getBoundingClientRect(),th=28;
 const ratio=Math.min(1,Math.max(0,(e.clientX-r.left-th/2)/(r.width-th)));
 const v=Math.round(+el.min+ratio*(el.max-el.min));if(String(v)!==el.value){el.value=v;setLevel()}});
let busy=false;
function show(v){const L=+$("lv").value;variant=v;
 if(busy)return;busy=true;$("go").disabled=true;$("out").classList.remove("hidden");$("result").textContent="考え中…";
 $("talkText").textContent="先輩が考えてくれてる…！";
 setTimeout(()=>{$("result").textContent=MSG[scene][who][L-1][variant];$("talkText").textContent="これなら言える！ありがとうございます、先輩！";hop();cheerUp("できたよ！");busy=false;$("go").disabled=false},700)}
function make(){if(!scene){$("talkText").textContent="先輩、まず何を断るか選んでください〜！";return}show(Math.floor(Math.random()*3))}
function again(){if(!scene)return make();show((variant+1)%3)}
$("go").onclick=make;$("again").onclick=again;
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("result").textContent);$("copy").textContent="コピーしました"}catch(e){$("copy").textContent="コピーできませんでした"}setTimeout(()=>$("copy").textContent="コピーする",1800)};
</script></body></html>
